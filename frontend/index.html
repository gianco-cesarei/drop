<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drops — Downloader</title>
<style>
  :root {
    --bg:#090909; --surface:#141414; --surface2:#0d0d0d; --border:#282828;
    --text:#f2f2f2; --muted:#777; --accent:#22c55e; --accent-dim:rgba(34,197,94,.15);
    --green:#22c55e; --red:#ef4444;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh; padding:20px; overflow:auto;
  }
  .shell { width:100%; max-width:520px; margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin:4px 0 6px; }
  .logo { font-size:28px; font-weight:900; letter-spacing:-1px; }
  .logo span { color:var(--accent); }
  .mode-btn {
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    border-radius:999px; padding:9px 13px; font-size:12px; font-weight:800; cursor:pointer;
  }
  .mode-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  .tagline { color:var(--muted); font-size:12px; margin-bottom:18px; }
  .update-banner {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px; padding:8px 11px; border:1px solid var(--border);
    background:var(--surface); border-radius:9px; color:var(--muted); font-size:11px;
  }
  .update-banner.available {
    border-color:rgba(34,197,94,.3); background:rgba(34,197,94,.08);
    color:var(--text); font-size:12px;
  }
  .update-banner button {
    display:none; color:var(--green); font-weight:850; text-decoration:none; white-space:nowrap;
    border:0; padding:0; background:transparent; cursor:pointer; font:inherit;
  }
  .update-banner.available button { display:inline; }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:16px;
  }
  .field { display:flex; flex-direction:column; gap:7px; }
  label,.section-label {
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
  }
  textarea,input[type=text] {
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:12px 13px; color:var(--text); font:14px inherit; outline:none; resize:vertical;
  }
  textarea { min-height:90px; max-height:180px; line-height:1.45; }
  textarea:focus,input:focus { border-color:var(--accent); }
  .hint { font-size:11px; color:var(--muted); }
  .quality { display:flex; gap:6px; }
  .q-btn,.folder-btn,.folder-reset {
    background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    color:var(--muted); padding:9px 10px; font-size:12px; font-weight:750; cursor:pointer;
  }
  .q-btn { flex:1; }
  .q-btn.active { color:var(--accent); border-color:var(--accent); background:var(--accent-dim); }
  .folder-row { display:flex; align-items:center; gap:8px; }
  .folder-path {
    min-width:0; flex:1; padding:9px 11px; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .folder-reset { display:none; padding:9px; }
  #clipSection { display:none; flex-direction:column; gap:10px; }
  .clip-toggle { display:flex; align-items:center; gap:7px; cursor:pointer; text-transform:none; letter-spacing:0; }
  #clipPanel {
    display:none; padding:12px; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; flex-direction:column; gap:9px;
  }
  .clip-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .primary {
    border:0; border-radius:10px; padding:14px; background:var(--accent); color:white;
    font-size:14px; font-weight:850; cursor:pointer;
  }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .error {
    display:none; color:var(--red); background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.22); border-radius:8px; padding:11px; font-size:12px;
  }
  .queue { display:none; flex-direction:column; gap:7px; }
  .queue-head { display:flex; justify-content:space-between; align-items:center; }
  .queue-count { color:var(--muted); font-size:11px; }
  .job {
    padding:10px 11px; border:1px solid var(--border); background:var(--surface2);
    border-radius:8px; display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center;
  }
  .job-icon { font-size:15px; }
  .job-main { min-width:0; }
  .job-title { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .job-detail { color:var(--muted); font-size:10px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .job-status { color:var(--muted); font-size:10px; font-weight:800; }
  .job.ready .job-status { color:var(--green); }
  .job.error .job-status { color:var(--red); }
  .bar { height:2px; background:var(--border); margin-top:6px; overflow:hidden; border-radius:2px; }
  .fill { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .footer { text-align:center; color:#444; font-size:10px; margin:14px 0; }
  @media(max-width:520px) { body{padding:12px}.card{padding:17px}.folder-row{flex-wrap:wrap}.folder-path{flex-basis:100%} }
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="logo">Drops<span>.</span></div>
    <button id="modeButton" class="mode-btn" type="button" onclick="toggleMode()">🎬 Video</button>
  </div>
  <div class="tagline" id="tagline">MP3 alta qualità · YouTube & SoundCloud</div>
  <div class="update-banner" id="updateBanner">
    <span id="updateText">Controllo aggiornamenti…</span>
    <button id="updateButton" type="button" onclick="openUpdate()">Aggiorna ↗</button>
  </div>

  <section class="card">
    <div class="field">
      <label for="urlInput">Link da mettere in coda</label>
      <textarea id="urlInput" placeholder="Un link YouTube o SoundCloud per riga" spellcheck="false"></textarea>
      <div class="hint">Incolla uno o più link. Drops li scarica in coda.</div>
    </div>

    <div class="field">
      <div class="section-label">Cartella di salvataggio</div>
      <div class="folder-row">
        <div class="folder-path" id="folderPath">Download (automatica)</div>
        <button class="folder-btn" type="button" onclick="chooseFolder()">Scegli cartella</button>
        <button class="folder-reset" id="folderReset" type="button" onclick="resetFolder()">↺</button>
      </div>
    </div>

    <div class="field" id="audioQualitySection">
      <div class="section-label">Qualità MP3</div>
      <div class="quality" id="audioQuality">
        <button class="q-btn" data-value="128" onclick="setQuality(this)">128k</button>
        <button class="q-btn" data-value="192" onclick="setQuality(this)">192k</button>
        <button class="q-btn active" data-value="320" onclick="setQuality(this)">320k</button>
        <button class="q-btn" data-value="flac" onclick="setQuality(this)">FLAC</button>
      </div>
    </div>

    <div class="field" id="videoQualitySection" style="display:none">
      <div class="section-label">Qualità video</div>
      <div class="quality" id="videoQuality">
        <button class="q-btn active" data-value="1080" onclick="setVideoQuality(this)">1080p</button>
        <button class="q-btn" data-value="720" onclick="setVideoQuality(this)">720p</button>
        <button class="q-btn" data-value="480" onclick="setVideoQuality(this)">480p</button>
      </div>
    </div>

    <div id="clipSection">
      <label class="clip-toggle">
        <input type="checkbox" id="clipToggle" onchange="toggleClip()"> ✂️ Taglia clip video
      </label>
      <div id="clipPanel">
        <div class="hint">Formato mm:ss oppure hh:mm:ss</div>
        <div class="clip-grid">
          <div class="field"><label for="clipStart">Inizio</label><input id="clipStart" type="text" placeholder="00:00"></div>
          <div class="field"><label for="clipDuration">Durata</label><input id="clipDuration" type="text" placeholder="05:00"></div>
        </div>
      </div>
    </div>

    <button class="primary" id="addButton" type="button" onclick="enqueueLinks()">Aggiungi alla coda MP3</button>
    <div class="error" id="errorBox"></div>

    <div class="queue" id="queue">
      <div class="queue-head">
        <div class="section-label">Coda</div>
        <div class="queue-count" id="queueCount"></div>
      </div>
      <div id="queueList"></div>
    </div>
  </section>
  <div class="footer">File salvati sul computer. 3 download simultanei.</div>
</main>

<script>
const API_URL = window.__API_URL__ || localStorage.getItem('__api_url__') || '';
let mode = 'audio';
let quality = '320';
let videoQuality = '1080';
let destinationToken = null;
let destinationPath = null;
const jobs = new Map();
let pollTimer = null;

async function checkForUpdates() {
  const banner = document.getElementById('updateBanner');
  const text = document.getElementById('updateText');
  banner.classList.remove('available');
  try {
    const response = await fetch(`${API_URL}/update/check`);
    if (!response.ok) return;
    const data = await response.json();
    if (!data.available || !data.release_url) {
      text.textContent = data.latest_version
        ? `Aggiornata · v${data.current_version}`
        : `Drops · v${data.current_version}`;
      return;
    }
    text.textContent = `Drops v${data.latest_version} disponibile`;
    banner.classList.add('available');
  } catch (_) {
    // App resta utilizzabile anche senza rete o GitHub.
  }
}

async function openUpdate() {
  const button = document.getElementById('updateButton');
  button.disabled = true;
  try {
    const response = await fetch(`${API_URL}/update/open`, {method:'POST'});
    if (!response.ok) throw new Error('Apertura aggiornamento fallita');
  } catch (_) {
    document.getElementById('updateText').textContent = 'Impossibile aprire aggiornamento';
  } finally {
    button.disabled = false;
  }
}

checkForUpdates();

function toggleMode() {
  mode = mode === 'audio' ? 'video' : 'audio';
  const video = mode === 'video';
  const button = document.getElementById('modeButton');
  button.classList.toggle('active', video);
  button.textContent = video ? '🎵 MP3' : '🎬 Video';
  document.getElementById('tagline').textContent = video
    ? 'Video MP4 · taglio clip disponibile'
    : 'MP3 alta qualità · YouTube & SoundCloud';
  document.getElementById('audioQualitySection').style.display = video ? 'none' : 'flex';
  document.getElementById('videoQualitySection').style.display = video ? 'flex' : 'none';
  document.getElementById('clipSection').style.display = video ? 'flex' : 'none';
  if (!video) {
    document.getElementById('clipToggle').checked = false;
    toggleClip();
  }
  updateButton();
}

function setQuality(button) {
  quality = button.dataset.value;
  document.querySelectorAll('#audioQuality .q-btn').forEach(el => el.classList.remove('active'));
  button.classList.add('active');
}

function setVideoQuality(button) {
  videoQuality = button.dataset.value;
  document.querySelectorAll('#videoQuality .q-btn').forEach(el => el.classList.remove('active'));
  button.classList.add('active');
}

function toggleClip() {
  const enabled = mode === 'video' && document.getElementById('clipToggle').checked;
  document.getElementById('clipPanel').style.display = enabled ? 'flex' : 'none';
  if (!enabled) {
    document.getElementById('clipStart').value = '';
    document.getElementById('clipDuration').value = '';
  }
  updateButton();
}

function updateButton() {
  const clipped = mode === 'video' && document.getElementById('clipToggle').checked;
  document.getElementById('addButton').textContent = mode === 'audio'
    ? 'Aggiungi alla coda MP3'
    : clipped ? 'Aggiungi clip video alla coda' : 'Aggiungi video alla coda';
}

async function chooseFolder() {
  hideError();
  try {
    const response = await fetch(`${API_URL}/select-folder`, { method:'POST' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Selettore cartella non disponibile');
    if (!data.selected) return;
    destinationToken = data.token;
    destinationPath = data.path;
    document.getElementById('folderPath').textContent = destinationPath;
    document.getElementById('folderReset').style.display = 'block';
  } catch (error) {
    showError(error.message);
  }
}

function resetFolder() {
  destinationToken = null;
  destinationPath = null;
  document.getElementById('folderPath').textContent = 'Download (automatica)';
  document.getElementById('folderReset').style.display = 'none';
}

function parseTime(value) {
  if (!/^(\d{1,2}:)?\d{1,2}:\d{2}$/.test(value)) return null;
  const parts = value.split(':').map(Number);
  if (parts.some(Number.isNaN) || parts.at(-1) > 59 || (parts.length === 3 && parts[1] > 59)) return null;
  return parts.length === 3 ? parts[0]*3600 + parts[1]*60 + parts[2] : parts[0]*60 + parts[1];
}

async function enqueueLinks() {
  hideError();
  const links = [...new Set(document.getElementById('urlInput').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean))];
  if (!links.length) return showError('Incolla almeno un link YouTube o SoundCloud');

  let startTime = null;
  let duration = null;
  if (mode === 'video' && document.getElementById('clipToggle').checked) {
    startTime = parseTime(document.getElementById('clipStart').value.trim());
    duration = parseTime(document.getElementById('clipDuration').value.trim());
    if (startTime === null || duration === null || duration <= 0) {
      return showError('Inserisci inizio e durata validi: mm:ss oppure hh:mm:ss');
    }
  }

  const button = document.getElementById('addButton');
  button.disabled = true;
  let accepted = 0;
  const errors = [];
  for (const url of links) {
    try {
      const response = await fetch(`${API_URL}/download`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          url, format:mode, quality, video_quality:videoQuality,
          start_time:startTime, duration,
          destination_token:destinationToken
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Errore server');
      jobs.set(data.job_id, {
        id:data.job_id, url, format:mode, status:'pending', progress:0,
        destination:destinationPath || 'Download'
      });
      accepted++;
    } catch (error) {
      errors.push(`${url}: ${error.message}`);
    }
  }
  button.disabled = false;
  if (accepted) document.getElementById('urlInput').value = '';
  if (errors.length) showError(errors.join(' · '));
  renderQueue();
  startPolling();
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollJobs, 1000);
  pollJobs();
}

async function pollJobs() {
  const active = [...jobs.values()].filter(job => !['ready','error'].includes(job.status));
  if (!active.length) {
    clearInterval(pollTimer);
    pollTimer = null;
    return;
  }
  await Promise.all(active.map(async job => {
    try {
      const response = await fetch(`${API_URL}/status/${job.id}`);
      if (!response.ok) throw new Error('Job non trovato');
      Object.assign(job, await response.json());
    } catch (error) {
      job.status = 'error';
      job.error = error.message;
    }
  }));
  renderQueue();
}

function renderQueue() {
  const queue = document.getElementById('queue');
  const list = document.getElementById('queueList');
  const all = [...jobs.values()];
  queue.style.display = all.length ? 'flex' : 'none';
  const active = all.filter(job => !['ready','error'].includes(job.status)).length;
  document.getElementById('queueCount').textContent = `${active} attivi · ${all.length} totali`;
  list.replaceChildren();

  all.slice().reverse().forEach(job => {
    const item = document.createElement('div');
    item.className = `job ${job.status}`;
    const icon = document.createElement('div');
    icon.className = 'job-icon';
    icon.textContent = job.status === 'ready' ? '✅' : job.status === 'error' ? '⚠️' : job.format === 'video' ? '🎬' : '🎵';
    const main = document.createElement('div');
    main.className = 'job-main';
    const title = document.createElement('div');
    title.className = 'job-title';
    title.textContent = job.title || job.url;
    const detail = document.createElement('div');
    detail.className = 'job-detail';
    detail.textContent = job.status === 'ready'
      ? (job.saved_path || `Salvato in ${job.destination}`)
      : job.status === 'error' ? (job.error || 'Errore') : `${job.progress || 0}% · ${job.destination}`;
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('div');
    fill.className = 'fill';
    fill.style.width = `${job.progress || 0}%`;
    bar.appendChild(fill);
    main.append(title, detail, bar);
    const status = document.createElement('div');
    status.className = 'job-status';
    status.textContent = {pending:'IN CODA',downloading:'SCARICO',ready:'SALVATO',error:'ERRORE'}[job.status] || job.status;
    item.append(icon, main, status);
    list.appendChild(item);
  });
}

function showError(message) {
  const box = document.getElementById('errorBox');
  box.textContent = `⚠ ${message}`;
  box.style.display = 'block';
}
function hideError() { document.getElementById('errorBox').style.display = 'none'; }
</script>
</body>
</html>
