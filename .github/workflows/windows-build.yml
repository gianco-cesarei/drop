name: Build Drops

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Piattaforma da compilare"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - macos
          - all
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    # Windows resta sperimentale: parte solo manualmente e non pubblica Release.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.platform == 'windows' || inputs.platform == 'all')
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Backend: impacchetta FastAPI+uvicorn+yt-dlp in un exe ──────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend executable
        run: pyinstaller --clean --noconfirm backend/drops-backend.spec

      - name: Stage backend binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item dist/drops-backend.exe src-tauri/binaries/drops-backend.exe -Force

      # ─── ffmpeg static build ────────────────────────────────────────────────
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $exe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/binaries/ffmpeg.exe -Force

      # ─── Smoke test su Windows reale ────────────────────────────────────────
      # Avvia l'exe impacchettato e verifica che la UI venga servita (/ = 200 HTML)
      # e che /health risponda. Cosi il bug "frontend non trovato" (v1.0) fa
      # fallire la build PRIMA di generare l'installer e pubblicare.
      - name: Smoke test backend exe
        shell: pwsh
        run: |
          $env:DROPS_FFMPEG_DIR = "$PWD/src-tauri/binaries"
          $env:DROPS_PORT = "8000"
          $proc = Start-Process -FilePath "src-tauri/binaries/drops-backend.exe" -PassThru
          try {
            $uiOk = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200 -and $r.Content -match "<html") { $uiOk = $true; break }
              } catch { }
            }
            if (-not $uiOk) {
              throw "FAIL: la UI non viene servita (/ != 200 HTML). Il frontend non e impacchettato nell'exe."
            }
            $h = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 5
            if ($h.StatusCode -ne 200) { throw "FAIL: /health non risponde 200." }
            Write-Host "OK: UI servita correttamente e /health a posto su Windows reale."
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # ─── Download reale (gate bloccante) ────────────────────────────────────
      # Scarica davvero un MP3 e valida l'intera pipeline (yt-dlp + ffmpeg)
      # sull'exe impacchettato. Fonte: SoundCloud (traccia NASA, pubblico
      # dominio, stabile) — NON usiamo YouTube perche' blocca l'IP dei runner
      # datacenter. Se questo passo fallisce la build si ferma: il download
      # DEVE funzionare per pubblicare.
      - name: Download reale MP3 (gate)
        shell: pwsh
        run: |
          $env:DROPS_FFMPEG_DIR = "$PWD/src-tauri/binaries"
          $dl = Join-Path $env:RUNNER_TEMP "drops-dl"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $env:DROPS_DOWNLOAD_DIR = $dl
          # Porta diversa dallo smoke test (8000) per evitare collisioni sul socket
          $env:DROPS_PORT = "8001"
          # ffmpeg deve essere eseguibile (serve per creare l'mp3)
          & "src-tauri/binaries/ffmpeg.exe" -version | Select-Object -First 1
          $proc = Start-Process -FilePath "src-tauri/binaries/drops-backend.exe" -PassThru
          try {
            $up = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try { if ((Invoke-WebRequest "http://127.0.0.1:8001/health" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $up = $true; break } } catch { }
            }
            if (-not $up) { throw "Backend non avviato per il test di download." }

            $body = @{ url = "https://soundcloud.com/nasa/small-steps-giant-793608487"; quality = "320"; format = "audio" } | ConvertTo-Json
            $r = Invoke-RestMethod -Uri "http://127.0.0.1:8001/download" -Method Post -ContentType "application/json" -Body $body
            $job = $r.job_id
            Write-Host "Job avviato: $job"

            $s = $null
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              $s = Invoke-RestMethod -Uri "http://127.0.0.1:8001/status/$job"
              if ($s.status -eq "ready" -or $s.status -eq "error") { break }
            }
            Write-Host "Stato finale: $($s.status) (progress $($s.progress)%)"
            if ($s.status -ne "ready") { throw "Download non completato: $($s.error)" }

            Invoke-WebRequest -Uri "http://127.0.0.1:8001/file/$job" -UseBasicParsing -OutFile "$dl/out.mp3"
            $size = (Get-Item "$dl/out.mp3").Length
            Write-Host "MP3 scaricato: $size byte"
            if ($size -lt 10000) { throw "File troppo piccolo ($size byte): probabile download fallito." }
            Write-Host "OK: pipeline di download MP3 funzionante su Windows reale."
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # ─── Toolchain Tauri ────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: npm install

      - name: Generate app icons (incl. .ico per Windows)
        run: npm run tauri icon src-tauri/icons/icon.png

      # ─── Build installer NSIS ───────────────────────────────────────────────
      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build -- --bundles nsis

      - name: Rename installer (nome leggibile)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "Drops-${{ github.ref_name }}-Windows.exe" -Force

      - name: Upload installer (artifact interno)
        uses: actions/upload-artifact@v4
        with:
          name: drops-windows-installer
          path: Drops-${{ github.ref_name }}-Windows.exe
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # Build macOS (.dmg) — runner Apple Silicon (macos-14): app arm64 NATIVA
  # (niente Rosetta). Con Developer ID viene firmata/notarizzata; fallback
  # ad-hoc destinato esclusivamente a build private di verifica.
  # ══════════════════════════════════════════════════════════════════════════
  build-macos:
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'macos' ||
      inputs.platform == 'all'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend executable (Mach-O)
        run: pyinstaller --clean --noconfirm backend/drops-backend.spec

      - name: Stage backend binary
        run: |
          mkdir -p src-tauri/binaries
          cp dist/drops-backend src-tauri/binaries/drops-backend
          chmod +x src-tauri/binaries/drops-backend

      # ffmpeg statico per l'architettura del runner (arm64) via pacchetto npm.
      - name: Get ffmpeg (static, arch-matched)
        run: |
          npm i ffmpeg-static --no-save --prefix /tmp/ffdl
          cp /tmp/ffdl/node_modules/ffmpeg-static/ffmpeg src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg

      # Stesso smoke test di Windows: l'exe deve servire la UI e /health.
      - name: Smoke test backend exe
        run: |
          export DROPS_FFMPEG_DIR="$PWD/src-tauri/binaries"
          export DROPS_PORT=8000
          ./src-tauri/binaries/drops-backend &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /tmp/root.html -w "%{http_code}" http://127.0.0.1:8000/ || true)
            if [ "$code" = "200" ] && grep -q "<html" /tmp/root.html; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "FAIL: la UI non viene servita (/ != 200 HTML)."
            kill $PID 2>/dev/null || true
            exit 1
          fi
          h=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health)
          kill $PID 2>/dev/null || true
          if [ "$h" != "200" ]; then echo "FAIL: /health != 200"; exit 1; fi
          echo "OK: UI e /health a posto su macOS reale."

      # Download reale (gate): valida yt-dlp + ffmpeg arm64 sul backend Mach-O.
      # Stessa fonte SoundCloud del job Windows. Se fallisce, la build si ferma.
      - name: Download reale MP3 (gate)
        run: |
          export DROPS_FFMPEG_DIR="$PWD/src-tauri/binaries"
          DL="$(mktemp -d)"
          export DROPS_DOWNLOAD_DIR="$DL"
          export DROPS_PORT=8001
          "src-tauri/binaries/ffmpeg" -version | head -1
          ./src-tauri/binaries/drops-backend &
          PID=$!
          up=0
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8001/health" || true)
            if [ "$code" = "200" ]; then up=1; break; fi
          done
          if [ "$up" != "1" ]; then echo "Backend non avviato"; kill $PID 2>/dev/null || true; exit 1; fi
          body='{"url":"https://soundcloud.com/nasa/small-steps-giant-793608487","quality":"320","format":"audio"}'
          job=$(curl -s -X POST "http://127.0.0.1:8001/download" -H "Content-Type: application/json" -d "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('job_id',''))")
          echo "Job avviato: $job"
          st=""
          for i in $(seq 1 90); do
            sleep 2
            st=$(curl -s "http://127.0.0.1:8001/status/$job" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))")
            if [ "$st" = "ready" ] || [ "$st" = "error" ]; then break; fi
          done
          echo "Stato finale: $st"
          if [ "$st" != "ready" ]; then kill $PID 2>/dev/null || true; echo "Download non completato"; exit 1; fi
          curl -s "http://127.0.0.1:8001/file/$job" -o "$DL/out.mp3"
          size=$(stat -f%z "$DL/out.mp3")
          kill $PID 2>/dev/null || true
          echo "MP3 scaricato: $size byte"
          if [ "$size" -lt 10000 ]; then echo "File troppo piccolo: download fallito"; exit 1; fi
          echo "OK: pipeline di download MP3 funzionante su macOS reale."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: npm install

      # Solo l'.app: NON usiamo il bundle dmg di Tauri (bundle_dmg.sh usa
      # AppleScript/Finder ed è inaffidabile su runner CI headless).
      - name: Build Tauri app (.app)
        run: npm run tauri build -- --bundles app

      # Firma sempre componenti annidati e bundle completo prima del DMG.
      # Developer ID usa hardened runtime; build privata usa firma ad-hoc.
      - name: Firma e verifica app
        run: |
          APP="src-tauri/target/release/bundle/macos/Drops.app"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            SIGN_ARGS=(--force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY")
          else
            SIGN_ARGS=(--force --timestamp=none --sign -)
          fi
          codesign "${SIGN_ARGS[@]}" "$APP/Contents/Resources/drops-backend"
          codesign "${SIGN_ARGS[@]}" "$APP/Contents/Resources/ffmpeg/ffmpeg"
          codesign "${SIGN_ARGS[@]}" "$APP/Contents/MacOS/drops"
          codesign "${SIGN_ARGS[@]}" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # DMG creato con hdiutil (nativo, niente AppleScript): sempre affidabile.
      - name: Crea DMG (hdiutil)
        run: |
          APP="src-tauri/target/release/bundle/macos/Drops.app"
          STAGING="$(mktemp -d)/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Drops" -srcfolder "$STAGING" -ov -format UDZO \
            "Drops-${{ github.ref_name }}-macOS.dmg"
          cp INSTALLAZIONE_DROPS_MAC.txt "LEGGIMI-Installazione-Drops-Mac.txt"

      - name: Upload dmg e guida (artifact interno)
        uses: actions/upload-artifact@v4
        with:
          name: drops-macos-dmg
          path: |
            Drops-${{ github.ref_name }}-macOS.dmg
            LEGGIMI-Installazione-Drops-Mac.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Drops ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Drops-${{ github.ref_name }}-macOS.dmg
            LEGGIMI-Installazione-Drops-Mac.txt
