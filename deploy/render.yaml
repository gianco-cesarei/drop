services:
  - type: web
    name: mp3-downloader-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PASSWORD
        sync: false   # Imposta manualmente nel dashboard Render
    healthCheckPath: /health
